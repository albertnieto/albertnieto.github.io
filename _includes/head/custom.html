<!-- Custom Head Include -->
<style>
    /* VARIABLES & THEME CONFIG */
    :root {
        /* Light Mode (Default) */
        --global-bg-color: rgba(255, 255, 255, 0.6);
        --global-text-color: #2e2e2e;
        --global-accent: #000;
        --glass-border: rgba(255, 255, 255, 0.4);
        --glass-shadow: rgba(0, 0, 0, 0.05);
        --card-bg: rgba(255, 255, 255, 0.4);

        --nav-height: 60px;
        --footer-bg: rgba(255, 255, 255, 0.1);
    }

    body.dark-mode {
        /* Dark Mode */
        --global-bg-color: rgba(0, 0, 0, 0.5);
        --global-text-color: #f0f0f0;
        --global-accent: #fff;
        --glass-border: rgba(255, 255, 255, 0.1);
        --glass-shadow: rgba(0, 0, 0, 0.5);
        --card-bg: rgba(20, 20, 20, 0.4);
        --footer-bg: rgba(0, 0, 0, 0.3);
    }

    /* GLOBAL RESET & BASE STYLES */
    body {
        background-color: transparent !important;
        /* Allow shader to show */
        color: var(--global-text-color) !important;
        transition: color 0.3s ease, background-color 0.3s ease;
    }

    /* Enable smooth scrolling */
    html {
        scroll-behavior: smooth;
    }

    /* GLASSMORPHISM UTILITY & APPLIED CLASSES */
    .glass,
    .masthead .masthead__inner-wrap,
    .page__content,
    .archive,
    .initial-content,
    .btn {
        background: var(--card-bg) !important;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border);
        box-shadow: 0 4px 6px var(--glass-shadow);
        border-radius: 12px;
    }

    /* LAYOUT OVERRIDES */

    /* Masthead (Top Bar) */
    .masthead {
        background: rgba(255, 255, 255, 0.0) !important;
        /* Fully transparent initially */
        border-bottom: none !important;
        position: sticky;
        top: 0;
        z-index: 20;
        padding: 10px 0;
        transition: all 0.3s ease;
    }

    .masthead .masthead__inner-wrap {
        padding: 0.5rem 2rem;
        max-width: 1200px;
        margin: 0 auto;
        border-radius: 50px;
        /* Pill shape for elegance */
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .masthead__menu-item {
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-size: 0.85rem;
    }

    .masthead__menu-item a {
        color: var(--global-text-color) !important;
        position: relative;
    }

    /* Hover effect for menu items */
    .masthead__menu-item a::after {
        content: '';
        display: block;
        width: 0;
        height: 1px;
        background: var(--global-accent);
        transition: width 0.3s;
    }

    .masthead__menu-item a:hover::after {
        width: 100%;
    }

    /* MAIN CONTENT BLOCKS */
    .page__content,
    .archive,
    .initial-content {
        padding: 2rem !important;
        margin-top: 2rem;
        margin-bottom: 2rem;
    }

    /* Sidebar / Profile */
    .sidebar {
        opacity: 0.95;
    }

    .author__content,
    .author__urls-wrapper {
        background: transparent !important;
    }

    .author__avatar img {
        border: 2px solid var(--glass-border);
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }

    /* FOOTER (Low Bar) */
    .page__footer {
        background: var(--footer-bg) !important;
        backdrop-filter: blur(5px);
        color: var(--global-text-color) !important;
        border-top: 1px solid var(--glass-border);
        margin-top: 4rem;
        padding: 2em 0;
        position: relative;
        z-index: 10;
    }

    .page__footer footer {
        opacity: 0.7;
        font-size: 0.8rem;
        text-align: center;
        color: var(--global-text-color) !important;
    }

    /* TEXT & HEADINGS */
    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    p,
    li {
        color: var(--global-text-color) !important;
    }

    a {
        color: var(--global-text-color);
        text-decoration: none;
    }

    a:hover {
        text-decoration: none;
        opacity: 0.7;
    }

    /* BUTTONS */
    .btn {
        background: var(--glass-border) !important;
        color: var(--global-text-color) !important;
        border-radius: 30px !important;
        transition: transform 0.2s, box-shadow 0.2s;
        border: 1px solid var(--glass-border);
    }

    .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px var(--glass-shadow);
    }

    /* THEME TOGGLE BUTTON UI */
    #theme-toggle {
        /* Default Fixed Position (Fallback) */
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 50px;
        height: 50px;
        z-index: 100;

        /* Styling */
        border-radius: 50%;
        border: 1px solid var(--glass-border);
        background: var(--card-bg);
        backdrop-filter: blur(10px);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s ease, background 0.3s;
        color: var(--global-text-color);
    }

    /* Navbar Position Overrides */
    #theme-toggle.in-navbar {
        position: static;
        /* Remove fixed positioning */
        width: 40px;
        height: 40px;
        margin-left: 1rem;
        background: transparent;
        border: 1px solid var(--glass-border);
        box-shadow: none;
    }

    #theme-toggle:hover {
        transform: scale(1.1);
        background: var(--glass-border);
    }

    #theme-toggle svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
    }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/assets/js/theme-switcher.js" defer></script>
<script src="/assets/js/fusion-shader.js" defer></script>
